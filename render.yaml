databases:
  - name: visit-tracker-db
    plan: free
    databaseName: visit_tracker

services:
  - type: web
    name: visit-tracker
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: visit-tracker-db
          property: connectionString
      # The medication-detection exercise needs an LLM key. Uncomment and set the
      # value in the Render dashboard (Environment) once you implement it.
      # - key: LLM_API_KEY
      #   sync: false
      # - key: LLM_MODEL
      #   value: gpt-4.1-mini
